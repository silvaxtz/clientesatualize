<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atualize Telecom - Pesquisa de Clientes</title>

    <meta name="theme-color" content="#00b050">

    <meta name="description" content="Sistema interno da Atualize Telecom">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

    <!-- Fonte -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- XLSX -->

    <script src="xlsx.full.min.js"></script>

</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginTela" class="container">

    <img src="logo.png" class="logo" alt="Atualize Telecom">

    <h1>Atualize Telecom</h1>

    <p class="subtitulo">

        Sistema de Pesquisa de Clientes

    </p>

    <input
        id="usuario"
        type="text"
        placeholder="Usuário"
        autocomplete="username">

    <input
        id="senha"
        type="password"
        placeholder="Senha"
        autocomplete="current-password">

    <button id="btnLogin">

        Entrar

    </button>

    <div id="erroLogin"></div>

</div>

<!-- ================= SISTEMA ================= -->

<div id="sistema" class="container" style="display:none;">

    <div class="topo">

        <span id="usuarioLogado"></span>

        <div>

            <button
                id="btnAdmin"
                style="display:none;">

                Painel

            </button>

            <button id="btnSair">

                Sair

            </button>

        </div>

    </div>

    <img
        src="logo.png"
        class="logo"
        alt="Atualize Telecom">

    <h1>Pesquisa de Clientes</h1>

    <div class="search-box">

        <i data-lucide="search"></i>

        <input
            type="text"
            id="pesquisa"
            placeholder="Digite PPOE ou IP..."
            autocomplete="off">

    </div>

    <div
        id="historicoPesquisas"
        class="historico-container">

    </div>

    <div id="resultado"></div>

</div>

<!-- ================= PAINEL ADMIN ================= -->

    <!-- ================= PAINEL ADMIN ================= -->

<div id="painelAdmin" class="container" style="display:none;">

    <div class="topo">

        <div>

            <h2>Painel Administrativo</h2>

            <span class="subtitulo-admin">

                Atualize Telecom

            </span>

        </div>

        <button id="fecharAdmin">

            Fechar

        </button>

    </div>

    <div class="cards-admin">

        <div class="card-admin">

            <span>

                <i data-lucide="users"></i>

                Clientes

            </span>

            <h2 id="totalClientes">0</h2>

        </div>

        <div class="card-admin">

            <span>

                <i data-lucide="router"></i>

                Painéis

            </span>

            <h2 id="totalPaineis">0</h2>

        </div>

        <div class="card-admin">

            <span>

                <i data-lucide="badge-check"></i>

                Bom

            </span>

            <h2 id="totalBom">0</h2>

        </div>

        <div class="card-admin">

            <span>

                <i data-lucide="triangle-alert"></i>

                Médio

            </span>

            <h2 id="totalMedio">0</h2>

        </div>

        <div class="card-admin">

            <span>

                <i data-lucide="circle-x"></i>

                Ruim

            </span>

            <h2 id="totalRuim">0</h2>

        </div>

    </div>

    <hr>

    <h2>

        <i data-lucide="chart-column"></i>

        Ranking dos Painéis

    </h2>

    <div id="rankingPaineis"></div>

    <hr>

    <h2>

        <i data-lucide="file-up"></i>

        Importar Planilha

    </h2>

    <input
        type="file"
        id="inputExcel"
        accept=".xlsx,.xls">

    <button id="btnImportarExcel">

        <i data-lucide="upload"></i>

        Carregar e Atualizar Dashboard

    </button>

    <hr>

    <button id="baixarJson">

        <i data-lucide="download"></i>

        Baixar clientes.json

    </button>

    <button id="copiarEstatisticas">

        <i data-lucide="clipboard-copy"></i>

        Copiar Estatísticas

    </button>

</div>

<!-- ================= ATUALIZAÇÃO ================= -->

<div id="updateBanner" class="update-banner">

    <span>

        <i data-lucide="rocket"></i>

        Nova versão disponível

    </span>

    <button id="btnAtualizarApp">

        Atualizar

    </button>

</div>

<div id="versaoApp">

    Versão 1.0.0

</div>

<script src="script.js"></script>

<script src="https://unpkg.com/lucide@latest"></script>

<script>

    lucide.createIcons();

</script>

</body>

</html>
