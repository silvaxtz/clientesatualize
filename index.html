<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atualize Telecom - Pesquisa de Clientes</title>

    <meta name="theme-color" content="#00b050">
    <meta name="description" content="Sistema interno de pesquisa de clientes">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <!-- XLSX -->
    <script src="xlsx.full.min.js"></script>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginTela" class="container">

    <img src="logo.png" class="logo" alt="Atualize">

    <h1>Atualize Telecom</h1>

    <p class="subtitulo">
        Sistema interno de pesquisa de clientes
    </p>

    <input
        type="text"
        id="usuario"
        placeholder="Usuário"
        autocomplete="username">

    <input
        type="password"
        id="senha"
        placeholder="Senha"
        autocomplete="current-password">

    <button id="btnLogin">
        Entrar
    </button>

    <div id="erroLogin"></div>

</div>

<!-- ================= SISTEMA ================= -->

<div
    id="sistema"
    class="container"
    style="display:none;">

    <div class="topo">

        <div>

            <span id="usuarioLogado"></span>

        </div>

        <div>

            <button
                id="btnAdmin"
                style="display:none;">

                Admin

            </button>

            <button id="btnSair">

                Sair

            </button>

        </div>

    </div>

    <img
        src="logo.png"
        class="logo"
        alt="Atualize">

    <h1>Pesquisa de Clientes</h1>

    <div class="pesquisa-box">

        <input
            id="pesquisa"
            type="text"
            placeholder="Digite PPOE ou IP..."
            autocomplete="off">

    </div>

    <div
        id="historicoPesquisas"
        class="historico-container">

    </div>

    <div id="resultado"></div>

</div>

<!-- ================= PAINEL ADMIN ================= -->

<div id="painelAdmin" class="container" style="display:none;">

    <div class="topo">

        <div>

            <h2>Painel Administrativo</h2>

            <p class="subtitulo-admin">
                Estatísticas da rede
            </p>

        </div>

        <button id="fecharAdmin">

            Fechar

        </button>

    </div>

    <div class="cards-admin">

        <div class="card-admin">
            <span>👥 Clientes</span>
            <h2 id="totalClientes">0</h2>
        </div>

        <div class="card-admin">
            <span>📡 Painéis</span>
            <h2 id="totalPaineis">0</h2>
        </div>

        <div class="card-admin">
            <span>🟢 Bom</span>
            <h2 id="totalBom">0</h2>
        </div>

        <div class="card-admin">
            <span>🟡 Médio</span>
            <h2 id="totalMedio">0</h2>
        </div>

        <div class="card-admin">
            <span>🔴 Ruim</span>
            <h2 id="totalRuim">0</h2>
        </div>

    </div>

    <hr>

    <h2>Ranking dos Painéis</h2>

    <div id="rankingPaineis"></div>

    <hr>

    <h2>Importar Planilha</h2>

    <input
        type="file"
        id="inputExcel"
        accept=".xlsx,.xls">

    <button id="btnImportarExcel">

        Carregar e Atualizar Dashboard

    </button>

    <hr>

    <button id="baixarJson">

        📥 Baixar clientes.json

    </button>

    <button id="copiarEstatisticas">

        📋 Copiar Estatísticas

    </button>

</div>

<div id="updateBanner" class="update-banner">

    <span>

        🚀 Nova versão disponível

    </span>

    <button id="btnAtualizarApp">

        Atualizar

    </button>

</div>

<div id="versaoApp">

    Versão 1.0.0

</div>

<script src="script.js"></script>

</body>

</html>
