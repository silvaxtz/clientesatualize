<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualize Telecom - Pesquisa de Clientes</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static/font/lucide.css">
    <meta name="theme-color" content="#00b050">

    <!-- Biblioteca para ler Excel -->
    <script src="xlsx.full.min.js"></script>

    <style>
        .historico-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            justify-content: center;
        }

        .btn-historico {
            background-color: #e0e0e0;
            color: #333;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            width: auto;
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginTela" class="container">
    <img src="logo.png" class="logo" alt="Atualize">

    <div class="input-icon">
    <i class="icon-user"></i>
    <input
        type="text"
        id="usuario"
        placeholder="Usuário"
        autocomplete="username">
</div>

<div class="input-icon">
    <i class="icon-lock"></i>
    <input
        type="password"
        id="senha"
        placeholder="Senha"
        autocomplete="current-password">
</div>

    <button id="btnLogin">Entrar</button>

    <div id="erroLogin"></div>
</div>

<!-- SISTEMA -->
<div id="sistema" class="container" style="display:none;">

    <div class="topo">
        <span id="usuarioLogado"></span>

        <div style="display:flex;gap:10px;align-items:center;">
           <button id="btnAdmin">
    <i class="icon-settings"></i>
    Admin
</button>
           <button id="btnSair">
    <i class="icon-log-out"></i>
    Sair
</button>

    </div>

    <img src="logo.png" class="logo" alt="Atualize">

    <h1>Pesquisa de Clientes</h1>

  <div class="search-box">

    <i class="icon-search"></i>

    <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar PPOE ou IP..."
    >

</div>

    <div id="historicoPesquisas" class="historico-container"></div>

    <div id="resultado"></div>

</div>

<!-- PAINEL ADMIN -->
<div id="painelAdmin" class="container" style="display:none;">

    <div class="topo">
        <h2>Painel Administrativo</h2>
        <button id="fecharAdmin">Fechar</button>
    </div>

    <div class="cards-admin">

      <div class="card-admin">
    <div class="card-title">
        <i class="icon-users"></i>
        <span>Clientes</span>
    </div>
    <h2 id="totalClientes">0</h2>
</div>

       <div class="card-admin">
    <div class="card-title">
        <i class="icon-waypoints"></i>
        <span>Painéis</span>
    </div>
    <h2 id="totalPaineis">0</h2>
</div>

<div class="card-admin">
    <div class="card-title">
        <i class="icon-circle-check-big"></i>
        <span>Bom</span>
    </div>
    <h2 id="totalBom">0</h2>
</div>

<div class="card-admin">
    <div class="card-title">
        <i class="icon-triangle-alert"></i>
        <span>Médio</span>
    </div>
    <h2 id="totalMedio">0</h2>
</div>

<div class="card-admin">
    <div class="card-title">
        <i class="icon-circle-x"></i>
        <span>Ruim</span>
    </div>
    <h2 id="totalRuim">0</h2>
</div>

    </div>

    <hr style="margin:30px 0;">

    <h2>📈 Top Painéis</h2>

    <div id="rankingPaineis"></div>

    <hr style="margin:30px 0;">

    <h2>🔄 Importar Planilha</h2>

    <div style="margin-bottom:20px;">

        <input
            type="file"
            id="inputExcel"
            accept=".xlsx,.xls"
            style="margin-bottom:10px;"
        >

        <br>

        <button id="btnImportarExcel">
            Carregar e Atualizar Dashboard
        </button>

    </div>

    <hr style="margin:30px 0;">

    <button id="baixarJson">📥 Baixar clientes.json</button>

    <button id="copiarEstatisticas">
        📋 Copiar Estatísticas
    </button>

</div>

<!-- BANNER DE ATUALIZAÇÃO -->
<div id="updateBanner" class="update-banner">
   <i class="icon-download"></i>

Nova versão disponível
    <button id="btnAtualizarApp">Atualizar</button>
</div>

<!-- VERSÃO DO APLICATIVO -->
<div id="versaoApp">Versão 1.0.0</div>

<script src="script.js"></script>

</body>
</html>
